<h1>公司名稱: {{ interview.company_name }}</h1>
<h1>職位: {{ interview.position }}</h1>
<h1>評分: {{ interview.rating }}</h1>

<a href="{% url 'interviews:index' %}">回面試列表</a>

<a href="{% url 'interviews:update' interview.id %}">更新</a>

<form action="{% url 'interviews:delete' interview.id %}" method="post" onsubmit="return confirm('確定要刪除？')">
    {% csrf_token %}
    <button>刪除</button>
</form>
