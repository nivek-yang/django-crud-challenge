<h1>公司名稱: {{ interview.company_name }}</h1>
<h2>職位: {{ interview.position }}</h2>
<h2>評價: {{ interview.rating }}/10</h2>

<a href="{% url 'interviews:index' %}">回上一頁</a>
<a href="{% url 'interviews:update' interview.id %}">修改</a>
<form action="{% url 'interviews:delete' interview.id %}" method="post" onsubmit="return confirm('確定要刪除？')">
    {% csrf_token %}
    <button>刪除</button>
</form>
