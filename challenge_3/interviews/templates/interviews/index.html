<h1>面試列表</h1>

<a href="{% url 'interviews:add' %}">新增</a>

<ul>
    {% for interview in interviews %}
        <li>
            <a href="{% url 'interviews:show' interview.id %}">
                <section>
                    <h2>公司名稱：{{ interview.company }}</h2>
                    <h2>職稱：{{ interview.position }}</h2>
                    <h2>評價：{{ interview.rating }}/10</h2>
                </section>
            </a>
        </li>
    {% endfor %}

</ul>
